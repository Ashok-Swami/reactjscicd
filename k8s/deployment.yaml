apiVersion: apps/v1
kind: Deployment

metadata:
  name: dreamy-frontend

spec:
  replicas: 2

  # Rolling update configuration
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: dreamy-frontend

  template:
    metadata:
      labels:
        app: dreamy-frontend

    spec:
      containers:
        - name: dreamy-frontend
          image: IMAGE_PLACEHOLDER

          envFrom:
            - configMapRef:
                name: dreamy-frontend-config

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3