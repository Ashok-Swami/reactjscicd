apiVersion: apps/v1
kind: Deployment
metadata:
  name: dreamy-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: dreamy-frontend

  template:
    metadata:
      labels:
        app: dreamy-frontend

    spec:
      containers:
        - name: dreamy-frontend
          image: IMAGE_PLACEHOLDER

          envFrom:
            - configMapRef:
                name: dreamy-frontend-config

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          # Checks whether the application is alive.
          # If this fails repeatedly, Kubernetes restarts the container.
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Checks whether the application is ready to receive traffic.
          # If this fails, Kubernetes removes the pod from Service endpoints.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3